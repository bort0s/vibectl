[workspace]
resolver = "3"
members = ["crates/vibe-core", "crates/vibectl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# `rust-version` is a CLAIM, not a check — ours and every dependency's.
#
# `resolver = "3"` selects dependency versions against this field, so
# MSRV-aware resolution is only as trustworthy as upstream's declaration. It can
# be wrong: `ignore` 0.4.30 declares 1.85 and uses let-chains, which are 1.88.
# Resolution happily picked it and the build failed on the pinned toolchain.
#
# **The only evidence MSRV holds is a green `MSRV (1.85.0)` job**, which compiles
# on that exact toolchain. It has already caught this twice: once as a
# deliberate negative control at P0, and once for real when adding a dependency
# refreshed the lock. A future dependency bump that turns it red is reporting a
# fact, not being fussy — pin the dependency or raise this number deliberately,
# but do not disable the job.
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"
authors = ["The vibectl Authors"]
repository = "https://github.com/bort0s/vibectl"
categories = ["command-line-utilities", "development-tools"]
keywords = ["registry", "projects", "scaffolding", "cli"]

# Versions are pinned here once and inherited by every member crate.
# Members opt in with `dep = { workspace = true }`; a dependency listed here
# but unused by any member costs nothing at build time.
[workspace.dependencies]
vibe-core = { version = "0.1.0", path = "crates/vibe-core" }

anyhow = "1.0.104"
# Content hashing for the agent lockfile. NOT on the originally approved
# dependency list - flagged as a deviation. The lockfile's only job is telling
# "we wrote this" from "the user edited it", which needs a real content hash:
# size+mtime cannot see an edit that preserves length, and getting that wrong
# means overwriting someone's work. `blake3` is chosen over `sha2` for speed on
# many small files; the algorithm prefix in the lockfile means either can be
# migrated to later.
blake3 = { version = "1.8.2", default-features = false, features = ["std"] }
clap = { version = "4.6.6", features = ["derive"] }
comfy-table = "7.2.1"
directories = "6.0.0"
# Pinned in Cargo.lock to 0.4.23. DO NOT unpin as stale housekeeping.
#
# 0.4.33 requires rustc 1.88 and declares it. 0.4.30 declares 1.85 and uses
# let-chains anyway, so it does NOT build on 1.85 — MSRV-aware resolution
# trusted the metadata and picked it, and only compiling on the pinned
# toolchain revealed it. See the note on rust-version below.
ignore = "0.4"
minijinja = "2.23.0"
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order` swaps the JSON map for an `IndexMap`, so key order survives
# a parse-and-serialise. ADR-0011 §7 decides the settings write, and vibe writes
# a file it does not own: without this, a re-install re-sorts a user's
# `.claude/settings.json` and the damage is invisible in a green test run.
#
# It costs NO new crate — `indexmap` is already in the graph via `toml_edit` —
# and `serde_json`'s only reverse dependents here are `vibe-core` and
# `vibectl`, so feature unification reaches nothing third-party.
#
# What it DID cost is recorded beside the controls it moved: the payload's
# verbatim-storage control used to rest on key order AND number formatting, and
# this feature removes the first while leaving the test green on the second.
# The branches were counted again and split into one control per producer
# BEFORE this line was added, plus `serde_json_in_this_build_preserves_key_order`
# — which fails if this feature is ever dropped, because nothing else would.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.20"
toml_edit = { version = "0.25.13", features = ["serde"] }

# dev-dependencies
insta = "1.48.0"
proptest = "1.11.0"
tempfile = "3.27.0"
# Dev-only, and only ever as a negative control. `toml` is the naive
# serde-round-trip path this project deliberately does not use; the round-trip
# property tests assert that it loses comments and unknown keys where
# `toml_edit` does not. It must never become a non-dev dependency.
toml = "1.1.4"

[workspace.lints.rust]
# `deny`, not `forbid`: forbid cannot be lowered by an inner `#[allow]`, and
# because `[lints] workspace = true` is all-or-nothing, one crate needing an
# escape hatch would have to abandon workspace inheritance entirely. Some
# derive macros also expand to `#[allow(unsafe_code)]`, which is a hard error
# under forbid. deny is equally strict by default and still fails CI.
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# The working agreement forbids leaving unresolved markers in the code.
# With `-D warnings` in CI, these fail the build rather than rotting.
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
# "debuginfo", not `true`. Stripping symbols entirely still leaves the panic
# message and its file:line (those are #[track_caller] string constants), but
# RUST_BACKTRACE then yields raw addresses, making user bug reports useless.
# It also inherits into [profile.bench], and P2's "50 repos under 2s" target
# has to be profiled with symbols present.
strip = "debuginfo"
