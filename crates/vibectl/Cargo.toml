[package]
name = "vibectl"
description = "A registry for the half-finished projects you already have. Scan, index, and keep them documented."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

# The crate publishes as `vibectl` (the root `vibe` name is taken on crates.io),
# but the binary users invoke is `vibe`.
[[bin]]
name = "vibe"
path = "src/main.rs"

[dependencies]
vibe-core = { workspace = true }

clap = { workspace = true }
serde_json = { workspace = true }

# `anyhow` is deliberately not declared yet. ADR-0001 §4 reserves it for this
# crate, but every P1 command returns a single error type, so adding it now
# would be an unused dependency waiting to become a habit.

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
