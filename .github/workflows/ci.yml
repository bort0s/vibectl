name: CI

on:
  push:
    # Every branch, deliberately unfiltered. An allowlist of branch prefixes has
    # exactly one failure mode — a branch nobody thought to list gets no CI at
    # all — and that is the gap this closes: `feat/agent-store` was pushed,
    # matched neither `main` nor a pull request, and ran nothing, which looks
    # identical to passing. Silent non-verification is the expensive outcome
    # here; runner-minutes on a scratch branch are not.
    #
    # `branches` (rather than omitting the filter) still excludes tag pushes, so
    # P7 cutting a release tag from an already-verified commit does not re-run
    # the whole matrix for nothing.
    #
    # A branch that later opens a PR is built twice, once per event. That is
    # accepted rather than fixed: suppressing it needs a condition on every job,
    # and the duplicate is at worst wasteful, while the alternative failure —
    # skipping a run that mattered — is the one being designed out.
    branches: ['**']
  pull_request:
    branches: [main]

# Least privilege: nothing here writes to the repo, publishes packages,
# or touches the API beyond reading the checked-out source.
permissions:
  contents: read

# A new push to the same ref makes the in-flight run obsolete. Pushes to main
# are NOT cancelled: P7 cuts releases from main, and a commit whose CI was
# cancelled by the next push would sit on main permanently unverified.
#
# Keyed on the ref rather than the event, because feature branches now trigger
# pushes too and the reasoning that applied to a PR applies to them unchanged:
# superseded runs are waste everywhere except main, where the point is that
# every commit keeps its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation is pure overhead on ephemeral runners: it produces
  # large artifacts that bloat the cache and are never reused across machines.
  CARGO_INCREMENTAL: 0
  # Registry/toolchain fetches are the flakiest part of Rust CI.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short
  # RUSTFLAGS is deliberately NOT set to "-D warnings" globally: denying
  # warnings is the lint job's contract, and applying it to the test matrix
  # would turn an unused import into a red "Test (windows-latest)" check that
  # misreports what actually broke.
  #
  # Note that this requires `rustflags: ""` on every setup-rust-toolchain step.
  # That action defaults its `rustflags` input to "-D warnings" and exports it
  # to $GITHUB_ENV whenever RUSTFLAGS is not already set, so omitting the input
  # would silently give the test matrix the strictness this comment disclaims.

jobs:
  fmt:
    name: Format (rustfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust (stable, rustfmt)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          # rustfmt never compiles the crate graph, so there is nothing worth
          # caching and no cargo registry to warm.
          cache: false
          rustflags: ""

      - name: Check formatting
        # Formatting is byte-identical on every platform; running this once is
        # sufficient. No --locked: rustfmt does not resolve dependencies.
        run: cargo fmt --all --check

  clippy:
    name: Lint (clippy, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Alongside `-- -D warnings`, this also catches plain rustc warnings
      # emitted while building build scripts and proc-macro dependencies.
      # Set here rather than via the toolchain action's input so there is
      # exactly one source of RUSTFLAGS in this workflow.
      RUSTFLAGS: -D warnings
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust (stable, clippy)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
          cache: false
          # See the workflow-level env comment. The job-level RUSTFLAGS above
          # is authoritative; this stops the action contributing a second one.
          rustflags: ""

      # WHICH BINARY, AND OVER WHAT TARGET.
      #
      # `toolchain: stable` names a channel, not a release, and `cargo-clippy`
      # on PATH is a rustup shim in any case — so neither this file nor a green
      # tick records what actually ran. That became expensive: the local gate
      # reported "clippy 0" for 48 commits while this job was about to fail on
      # `plan.rs:454`, and locating the difference meant guessing at versions
      # and config because neither side had written its own down.
      #
      # The difference was not the version. It was the HOST TRIPLE — the gate
      # ran on windows-msvc, where the `#[cfg(unix)]` block holding the defect
      # is stripped before clippy sees it. That is why the triple is printed
      # here and not only the version: it is the field that actually differed.
      #
      # scratchpad/gate.sh prints these same values beside its own numbers.
      # Printing them here is what makes the two sets of numbers comparable at
      # all; a gate whose numbers cannot be compared to CI's is reporting on a
      # different subject.
      - name: Report the toolchain this job will invoke
        shell: bash
        run: |
          set -euo pipefail
          echo "resolved binaries (not the PATH shim):"
          for b in cargo rustc cargo-clippy; do
            printf '  %-13s %s\n' "$b" "$(rustup which "$b")"
          done
          printf '  %-13s %s\n' "rustc" "$(rustc --version)"
          printf '  %-13s %s\n' "clippy" "$(cargo clippy --version)"
          printf '  %-13s %s\n' "host" "$(rustc -vV | awk '/^host:/ {print $2}')"

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          # rust-cache already folds runner.os, the host triple, the rustc
          # version and the Cargo.lock hash into the key, so caches can never
          # leak across OSes. `shared-key` keeps every leg of this matrix in a
          # namespace separate from the test matrix, whose target/ dir holds
          # different artifacts (real rlibs vs. clippy metadata).
          shared-key: clippy
          key: ${{ matrix.os }}

      - name: Run clippy
        # --all-targets covers tests, benches and examples, not just the lib/bin.
        # --locked fails loudly if Cargo.lock is stale or missing rather than
        # silently resolving to newer dependencies than the committed lockfile.
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Verify vibe-core's dependency boundary
        # Two invariants, both convention until something checks them:
        #
        # 1. ADR-0001 keeps argument parsing and terminal rendering out of
        #    `vibe-core` so a future Tauri frontend can consume it. Clippy's
        #    print_stdout/print_stderr denials catch the `println!` family;
        #    nothing stops someone adding `clap`.
        # 2. `toml` is the naive serde round-trip this project deliberately
        #    does not use. It is a dev-dependency purely as the negative
        #    control that proves the round-trip properties are non-trivial.
        #    If it ever reaches the real dependency tree, the comment saying
        #    "dev-only" has become a lie. `-e normal` excludes dev-deps, and
        #    the `^...$` anchors mean `toml_edit` is not matched by `toml`.
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          banned='^(clap|clap_builder|comfy-table|anyhow|toml)$'
          found=$(cargo tree --locked -p vibe-core -e normal --prefix none \
                  | awk '{print $1}' | sort -u | grep -E "$banned" || true)
          if [ -n "$found" ]; then
            echo "::error::vibe-core must not depend on these crates. Found:"
            echo "$found"
            exit 1
          fi
          # Guard the guard: toml_edit must still be present and must not have
          # been caught by the `toml` pattern.
          cargo tree --locked -p vibe-core -e normal --prefix none \
            | awk '{print $1}' | grep -qx 'toml_edit'
          echo "vibe-core dependency boundary OK"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Cross-platform path handling is a hard constraint for this project, so
      # a Linux failure must never cancel the Windows leg before it reports.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # No extra components: the test job needs neither rustfmt nor clippy.
          cache: false
          # Required, not optional: without this the action exports
          # RUSTFLAGS=-D warnings and a stray warning fails as a *test* failure.
          rustflags: ""

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          key: ${{ matrix.os }}

      - name: Build tests
        # Compiling first separates "it does not build on Windows" from
        # "a test assertion failed on Windows" in the checks list.
        run: cargo test --locked --workspace --all-features --no-run

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      # =====================================================================
      # What a VIBE_REQUIRE_* verify step proves. Read this before adding
      # another one, and copy this claim rather than writing a new one.
      #
      # PROVES: the named test targets exist, compile and pass - `cargo test
      #   --test <name>` exits 101 when a target is missing, so deleting or
      #   renaming a control turns the step red. And that every availability
      #   call which executed found the tool, because a missing one panics
      #   under the variable.
      #
      # DOES NOT PROVE: that any assertion inside those files ran. Zero guard
      #   calls and one hundred are the same green.
      #
      # The second half is measured rather than cautious. ADR-0008 §9
      # sabotaged both gh control files to return before their guard, and the
      # step stayed green on all three runners - runs 31480318558 and
      # 31480321845. An earlier version of this comment asserted the executed
      # half; the retraction went into that ADR and this comment kept the
      # disproved claim, which was then copied into two further places when
      # the git step was added. That is why the wording lives once, above the
      # group, instead of inside each step.
      #
      # In this project's own terms (ADR-0002 §7): VIBE_REQUIRE_* closes an
      # environment-shaped hole - a runner without the tool silently voiding a
      # check - and not a code-shaped one, because an exit status has nothing
      # to observe about what a test asserted.
      #
      # PRECONDITION for the first half: one control, one integration-test
      # target. Fold a control into a module of a shared target and it dies
      # silently - the target still exists and `--test <shared>` still exits 0.
      # =====================================================================

      # Run the gh controls by name, with output, and with the skip disabled.
      # ADR-0008 §6 gates the `gh` path on these, and a control that returned
      # early at its availability check produces the same green tick as one
      # that ran - which a whole-suite result cannot distinguish.
      #
      # gh_containment: can a per-user config redirect `gh repo create`?
      # gh_argv:        does this gh still accept the argv GhOp constructs?
      - name: Verify gh containment and argv (ADR-0008 §2, §6)
        env:
          VIBE_REQUIRE_GH: "1"
        run: >
          cargo test --locked -p vibe-core
          --test gh_containment --test gh_argv
          -- --nocapture --test-threads=1

      # The same shape for `git`, and for the same reason: every control in
      # ignore_state_git returns early when `git` is absent, which is the green
      # tick a passing run also produces, and VIBE_REQUIRE_GIT turns that into
      # a failure.
      #
      # What it protects (ADR-0010 §5, §8, §10): the exit-code mapping that
      # renders a prompt's privacy. A defect here reports "not ignored" - read
      # as "you're versioned, all good" - for a file nothing was learned about.
      # The controls are paired on both axes: Err-versus-Ok (a constructed PATH
      # with no `git`, against the same input with `git` present) and inside Ok
      # (an exit 128, against an exit 1 through the identical call).
      #
      # Two of these tests re-execute this same binary to construct a child
      # environment that cannot be set in-process. That composes with
      # --test-threads=1 - verified by running it, since the child has its own
      # harness and the parent only waits on a process - so the serial form is
      # kept for the same reason the gh step uses it: a failure names one test.
      # prompts_listing is phase 2's half of the same question: the instrument
      # can be right while the listing walks past every private prompt, or
      # reports an unreadable directory as a project with none. Its controls are
      # paired the same way - a private prompt listed and its state flipping
      # with the rule under it, user-level shadowing against the same file
      # removed, a user-level prompt not asked about against a project one that
      # is, and a partial walk against a complete one.
      - name: Verify the ignore-state instrument and the listing (ADR-0010 §5, §8, §10)
        env:
          VIBE_REQUIRE_GIT: "1"
        run: >
          cargo test --locked -p vibe-core
          --test ignore_state_git --test prompts_listing
          -- --nocapture --test-threads=1

  msrv:
    name: MSRV (1.85.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.85.0
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Pinned deliberately, not `stable`. Every other job runs whatever
          # stable is today (1.97.x), so nothing else would notice a 1.90-only
          # API landing in the codebase — the rust-version claim in Cargo.toml
          # and the README would silently rot.
          toolchain: "1.85.0"
          cache: false
          rustflags: ""

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv

      - name: Check against declared MSRV
        # `check`, not `test`: this verifies the crates compile on 1.85, which
        # is what rust-version promises. Dev-dependencies are excluded on
        # purpose — their MSRVs are their own business and would make this job
        # fail for reasons unrelated to our code.
        run: cargo check --locked --workspace

  # Single stable check to require in branch protection, so adding or removing
  # a matrix leg never means editing the repository's protection rules.
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `always()` would also fire when the whole run is cancelled by
    # cancel-in-progress, reporting a spurious failure on a superseded run.
    if: ${{ !cancelled() }}
    needs: [fmt, clippy, test, msrv]
    steps:
      - name: Verify all required jobs succeeded
        # Iterating over toJSON(needs) rather than a hand-written list: a job
        # added to `needs` but forgotten here would otherwise pass silently.
        # `all(...)` is true for an empty set, so the length check guards the
        # case where the context arrives empty.
        run: |
          echo '${{ toJSON(needs) }}' | jq .
          echo '${{ toJSON(needs) }}' | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null
