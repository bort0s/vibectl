[workspace]
resolver = "3"
members = ["crates/vibe-core", "crates/vibectl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"
authors = ["The vibectl Authors"]
categories = ["command-line-utilities", "development-tools"]
keywords = ["registry", "projects", "scaffolding", "cli"]

# Versions are pinned here once and inherited by every member crate.
# Members opt in with `dep = { workspace = true }`; a dependency listed here
# but unused by any member costs nothing at build time.
[workspace.dependencies]
vibe-core = { version = "0.1.0", path = "crates/vibe-core" }

anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
comfy-table = "7.2.1"
directories = "6.0.0"
ignore = "0.4.33"
minijinja = "2.23.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml_edit = { version = "0.25.13", features = ["serde"] }

# dev-dependencies
insta = "1.48.0"
proptest = "1.11.0"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# The working agreement forbids leaving unresolved markers in the code.
# With `-D warnings` in CI, these fail the build rather than rotting.
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
strip = true
